name: Validate Luodong Eats

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data.js
          node --check data-extra.js
          node --check data-auto.js
          node --check advanced/app.js
          node --check advanced/adapter.js
          node --check advanced/config.js
      - name: Validate website data
        run: node scripts/validate.mjs
